apiVersion: 1

datasources:
  - name: Flights
    type: grafana-postgresql-datasource
    uid: flights-db
    url: db:5432
    user: grafana_reader
    isDefault: true
    jsonData:
      database: flights
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
